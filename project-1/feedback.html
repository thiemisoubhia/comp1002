<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback page</title>
</head>
<body>
    <form action="js/script.js" method="post" id="customer-feedback-form">
    <h2>Tell us what you think!</h2>
    <fieldset>
        <legend>Your Experience</legend>
        <label for="rating">Rate the Arno Capilar Kit:</label>
        <div id="rating-stars">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
        </div>
        <input type="hidden" name="product_rating" id="product-rating" value="0">
        
        <label for="comment">Your Comments:</label>
        <textarea id="comment" name="comment" rows="5" required></textarea>
        
        <label for="purchase-year">Year Purchased:</label>
        <select id="purchase-year" name="purchase-year">
            <option value="1950s">1950s</option>
            <option value="1960s">1960s</option>
            <option value="1970s">1970s</option>
        </select>
    </fieldset>

    <input type="submit" value="Submit Feedback">
    <p id="feedback-message" style="display: none;">Thank you for your valuable feedback!</p>
</form>

</body>
</html>
